// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

// Expose commonly used Android properties (from gradle.properties) on rootProject.ext
// so modules (including app/build.gradle and third-party libraries) can read them
// as `rootProject.ext.minSdkVersion`, etc.
ext {
  minSdkVersion = Integer.parseInt((findProperty('android.minSdkVersion') ?: '21') as String)
  compileSdkVersion = Integer.parseInt((findProperty('android.compileSdkVersion') ?: '33') as String)
  targetSdkVersion = Integer.parseInt((findProperty('android.targetSdkVersion') ?: '33') as String)
  buildToolsVersion = (findProperty('android.buildToolsVersion') ?: '33.0.0') as String
  ndkVersion = (findProperty('android.ndkVersion') ?: '') as String
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
